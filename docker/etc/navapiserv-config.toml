# =============================================================================
# navapiserv-config.toml — конфиг NavAPI в Docker (UTF-8)
# =============================================================================
# Монтируется как /etc/navigator/navapiserv-config.toml
# Спецификация fusion v2: plan/KALMAN-ECEF-FUSION-v2.md
#
# Секции и ключи — см. комментарии в etc/gnrmc-provider.toml (тот же формат).
# Отличия deploy-образа:
#   DB = /db/gnrmc.db — том Docker
#   HTTP_Port = 7100 — порт контейнера
#   LogDir = /log/navapiserv
#   HardwarePort / Baud — по умолчанию ttyS0 @ 19200
# =============================================================================

[Database]
DB = "/db/gnrmc.db"
MaxRows = 150000

[Hardware]
HardwarePort = "/dev/ttyS0"
Baud = 19200
# HardwarePort = "/dev/ttyS3"
# Baud = 9600

[API]
Host = "0.0.0.0"
HTTP_Port = 7100
Workers = 1
Token = "A0473A67-27A1-3C05-A2D1-5C134639347F"

[System]
ProgramDirectory = "/app"
Input = ""
Stdin = false

[Log]
LogDir = "/log/navapiserv"
LogName = "gnrmc.log"
LogLevel = "INFO"
MaxLogs = 5
MaxSize = "5m"
LogRowNMEA = "no"
RowNMEA = "nmea-row.log"

[Memory]
CacheRecordsLength = 5000
CacheRecords = 100
ResidualCache = 10

[Navigation]
Profile = "tram"
VehicleProfilesPath = "VehicleProfiles.toml"
PublishMode = "measurement"
OutputRateHz = 10
SerialRestartOnRmcLoss = "yes"
SerialRestartAfterSec = 90
