# =============================================================================
# navapiserv-config.toml — конфиг NavAPI в Docker (UTF-8)
# =============================================================================
# Монтируется как /etc/navigator/navapiserv-config.toml
# Спецификация fusion v2: plan/KALMAN-ECEF-FUSION-v2.md
#
# Секции и ключи — см. комментарии в etc/gnrmc-provider.toml (тот же формат).
# Отличия deploy-образа:
#   DB = /db/gnrmc.db — том Docker
#   HTTP_Port = 7100 — порт контейнера
#   LogDir = /log/navapiserv
#   HardwarePort / Baud — в [Sources.nmea]; по умолчанию ttyS0 @ 19200
# =============================================================================

[Database]
DB = "/db/gnrmc.db"
MaxRows = 150000

[Sources.nmea]
Enabled = true
Type = "serial-nmea"
HardwarePort = "/dev/ttyS0"
Baud = 19200
# HardwarePort = "/dev/ttyS3"
# Baud = 9600

[Sources.qr-geo]
Enabled = false
Type = "qr-geo"
EventsUrl = "http://127.0.0.1:7140/api/qr-reader/v1/events"
GeoDbPath = "/db/qr_geo.db"
EventTimeSource = "event"
ConnectTimeoutMs = 5000
ReconnectMinMs = 500
ReconnectMaxMs = 30000
DedupWindowSec = 5

[Sources.imu]
Enabled = false
Type = "imu"

[Sources.triangulation]
Enabled = false
Type = "triangulation-http"

[API]
Host = "0.0.0.0"
HTTP_Port = 7100
Workers = 1
# Prefer NAVAPI_API_TOKEN from compose env_file .env
Token = ""
SseKeepaliveSec = 15

[System]
ProgramDirectory = "/app"
Input = ""
Stdin = false

[Log]
LogDir = "/log/navapiserv"
LogName = "gnrmc.log"
LogLevel = "INFO"
MaxLogs = 5
MaxSize = "5m"
LogRowNMEA = "yes"
RowNMEA = "nmea-row.log"

[Memory]
CacheRecordsLength = 5000
CacheRecords = 100
ResidualCache = 10

[Navigation]
Profile = "tram"
VehicleProfilesPath = "VehicleProfiles.toml"
PublishMode = "measurement"
OutputRateHz = 10
SerialRestartOnRmcLoss = "yes"
SerialRestartAfterSec = 90
