[Database]
DB = "/db/gnrmc.db"
MaxRows = 150000

[Sources.nmea]
Enabled = true
Type = "serial-nmea"
HardwarePort = "/dev/ttyS0"
Baud = 19200

[Sources.qr-geo]
Enabled = false
Type = "qr-geo"
EventsUrl = "http://127.0.0.1:7140/api/qr-reader/v1/events"
GeoDbPath = "/db/qr_geo.db"
EventTimeSource = "event"
ConnectTimeoutMs = 5000
ReconnectMinMs = 500
ReconnectMaxMs = 30000
DedupWindowSec = 5

[Sources.imu]
Enabled = false
Type = "imu"

[Sources.triangulation]
Enabled = false
Type = "triangulation-http"

[API]
Host = "0.0.0.0"
HTTP_Port = 7100
Workers = 5
# Prefer NAVAPI_API_TOKEN from compose env_file .env
Token = ""
SseKeepaliveSec = 15

[System]
ProgramDirectory = "/app"
Input = ""
Stdin = false

[Log]
LogDir = "/log/navapiserv"
LogName = "gnrmc.log"
LogLevel = "INFO"
MaxLogs = 5
MaxSize = "5m"
LogRowNMEA = "no"
RowNMEA = "nmea-row.log"

[Memory]
CacheRecordsLength = 5000
CacheRecords = 100
ResidualCache = 10
