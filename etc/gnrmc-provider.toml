# =============================================================================
# gnrmc-provider.toml — главный конфиг NMEA-API-Service (UTF-8)
# =============================================================================
# Запуск: python -m main --config etc/gnrmc-provider.toml
# Спецификация fusion v2: plan/KALMAN-ECEF-FUSION-v2.md
#
# [Database]
#   DB — путь к файлу SQLite с историей координат.
#   MaxRows — максимум строк в таблице gnrmc; старые удаляются retention-аудитом.
#
# [Sources.<name>] — провайдеры навигации (Enabled / Type + свои поля)
#   [Sources.nmea] — serial/file/stdin NMEA (HardwarePort, Baud).
#   [Sources.qr-geo] — SSE QR-reader + geo-lookup (EventsUrl, GeoDbPath, …).
#   [Sources.imu] — заглушка акселерометра / IMU.
#   [Sources.triangulation] — заглушка HTTP-клиента триангуляции оператора.
#   Legacy: если [Sources.nmea] нет, а есть [Hardware] — смапится в nmea.
#
# [API]
#   Host — адрес привязки HTTP-сервера (0.0.0.0 — все интерфейсы).
#   HTTP_Port — TCP-порт API.
#   Workers — число воркеров uvicorn; ОБЯЗАТЕЛЬНО 1: кэш обновляется в процессе
#     reader/fusion, а не в HTTP-воркерах.
#   Token — Bearer-токен для legacy и /api/qr-geo (fallback, если нет NAVAPI_API_TOKEN).
#   В Docker задавайте NAVAPI_API_TOKEN через .env / compose environment.
#
# [System]
#   ProgramDirectory — служебный каталог приложения.
#   Input — путь к файлу NMEA; если непустой — чтение из файла вместо serial.
#   Stdin — true: читать NMEA из stdin (если Input пуст).
#
# [Log]
#   LogDir — каталог основного лога.
#   LogName — имя файла основного лога.
#   LogLevel — уровень (INFO, DEBUG, WARNING, …).
#   MaxLogs — число ротируемых архивов.
#   MaxSize — размер файла до ротации (5m, 512k или байты).
#   LogRowNMEA — yes/no: дублировать сырые NMEA-строки в отдельный файл.
#   RowNMEA — имя файла сырого NMEA-лога.
#
# [Memory]
#   CacheRecordsLength — максимальный размер in-memory deque.
#   CacheRecords — окно flush: после стольких новых записей сбрасывается пачка в БД.
#   ResidualCache — число новейших записей, остающихся в RAM после flush.
#
# [Navigation] — NavFusion v2 (см. plan/KALMAN-ECEF-FUSION-v2.md)
#   Profile — секция VehicleProfiles.toml: tram | bus | custom.
#   VehicleProfilesPath — путь к файлу лимитов fusion (гейты, стоянка).
#   PublishMode — политика записи в кэш/API:
#     measurement — только accept RMC/ECEF (рекомендуется для RMC-only);
#     timer — predict + publish каждые 1/OutputRateHz с;
#     hybrid — measurement при GOOD; timer в паузах RMC.
#   OutputRateHz — частота внутреннего predict Kalman (1–20); при timer/hybrid
#     также частота публикации в кэш.
#   SerialRestartOnRmcLoss — yes/no: переоткрыть serial при долгой паузе GNRMC.
#   SerialRestartAfterSec — порог паузы GNRMC для рестарта (≥ TLostSec профиля).
# =============================================================================

[Database]
DB = "data/gnrmc.db"
MaxRows = 150000

[Sources.nmea]
Enabled = true
Type = "serial-nmea"
HardwarePort = "/dev/ttyS3"
Baud = 9600
# HardwarePort = "/dev/ttyS0"
# Baud = 19200

[Sources.qr-geo]
Enabled = false
Type = "qr-geo"
EventsUrl = "http://127.0.0.1:8000/api/qr-reader/v1/events"
GeoDbPath = "data/qr_geo.db"
ConnectTimeoutMs = 5000
ReconnectMinMs = 500
ReconnectMaxMs = 30000
DedupWindowSec = 5

[Sources.imu]
Enabled = false
Type = "imu"
# Device = "/dev/imu0"
# SampleRateHz = 100

[Sources.triangulation]
Enabled = false
Type = "triangulation-http"
# Url = "http://127.0.0.1:8080/position"
# IntervalMs = 1000
# TimeoutMs = 500

[API]
Host = "0.0.0.0"
HTTP_Port = 7000
Workers = 1
# Prefer NAVAPI_API_TOKEN env (Docker .env). Token below is local/dev fallback only.
Token = ""
SseKeepaliveSec = 30

[System]
ProgramDirectory = "/usr/local/gnrmc"
Input = ""
Stdin = false

[Log]
LogDir = "logs"
LogName = "gnrmc.log"
LogLevel = "INFO"
MaxLogs = 5
MaxSize = "5m"
LogRowNMEA = "no"
RowNMEA = "nmea-row.log"

[Memory]
CacheRecordsLength = 5000
CacheRecords = 100
ResidualCache = 10

[Navigation]
Profile = "tram"
VehicleProfilesPath = "VehicleProfiles.toml"
PublishMode = "measurement"
OutputRateHz = 10
SerialRestartOnRmcLoss = "yes"
SerialRestartAfterSec = 90
