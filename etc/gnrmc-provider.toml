[Database]
DB = "data/gnrmc.db"
MaxRows = 150000

[Hardware]
HardwarePort = "/dev/ttyS3"
Baud = 9600

[API]
Host = "0.0.0.0"
HTTP_Port = 7000
Workers = 5
Token = "A0473A67-27A1-3C05-A2D1-5C134639347F"

[System]
ProgramDirectory = "/usr/local/gnrmc"
Input = ""    # leave empty to read serial; or set to a test file
Stdin = false
LogDir = "logs"

[Memory]
# Max number of records kept in the in-memory cache
CacheRecordsLength = 5000

# Flush trigger: after this number of new records since the last DB write,
# the app will write ALL cached records to DB and clear the cache
CacheRecords = 100
