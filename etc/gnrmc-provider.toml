[Database]
DB = "data/gnrmc.db"
MaxRows = 150000

[Hardware]
HardwarePort = "/dev/ttyS3"
Baud = 9600

[API]
Host = "0.0.0.0"
HTTP_Port = 7000
Workers = 5
Token = "A0473A67-27A1-3C05-A2D1-5C134639347F"

[System]
ProgramDirectory = "/usr/local/gnrmc"
Input = ""    # leave empty to read serial; or set to a test file
Stdin = false

[Log]
LogDir = "logs"
LogName = "gnrmc.log"
LogLevel = "INFO"
MaxLogs = 5
MaxSize = "5m"
LogRowNMEA = "no"
RowNMEA = "nmea-row.log"

[Memory]
# Max number of records kept in the in-memory cache
CacheRecordsLength = 5000
# Flush window: (CacheRecords - ResidualCache) records go to DB, ResidualCache stay in cache
CacheRecords = 100
ResidualCache = 10

[Navigation]
Profile = "tram"
VehicleProfilesPath = "VehicleProfiles.toml"
OutputRateHz = 10
SerialRestartOnRmcLoss = "yes"
